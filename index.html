<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Meu Melzinho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: block;
            padding: 1rem 1.5rem;
            background: #2D6A4F;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #1b4d3e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45,106,79,0.25);
        }

        .btn-secondary {
            background: #1B5E6A;
        }

        .btn-secondary:hover {
            background: #12454e;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #adb5bd;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📚 Guia básico para uma Vida com mais prazer</h1>
            <div class="subtitle">Informação baseada na ciência do Amor!</div>
            
            <div class="links">
                <a href="ciclo_fertil_2026.html" class="btn">
                    🌸 Ciclo Fértil 2026
                </a>
                <a href="guia-artrite.html" class="btn btn-secondary">
                    🦴 Guia Básico Melhor Saúde
                </a>
            </div>
        </div>
        <footer>
            Material informativo · Consulte sempre profissionais de saúde
        </footer>
    </div>
</body>
</html>
